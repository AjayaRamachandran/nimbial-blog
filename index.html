<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nimbial Blog</title>
    <link rel="icon" type="image/svg" href="/assets/favicon.svg" />

    <!-- Apply the saved / system theme before first paint to avoid a flash -->
    <script>
      (function () {
        var dark = false;
        try {
          var t = localStorage.getItem("theme");
          if (!t && localStorage.getItem("darkMode") === "on") t = "dark";
          dark = t === "dark" ||
            (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
        if (dark) document.documentElement.classList.add("dark-mode");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>

    <!-- Open Graph Meta Tags (defaults for homepage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nimbial - Blog" />
    <meta property="og:title" content="Read it on the Nimbial Blog" />
    <meta property="og:description" content="Read it on the Nimbial Blog" />
    <meta property="og:image" content="https://blog.nimbial.com/assets/link-preview.png" />
    <meta property="og:image:url" content="https://blog.nimbial.com/assets/link-preview.png" />
    <meta property="og:image:secure_url" content="https://blog.nimbial.com/assets/link-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="695" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Read it on the Nimbial Blog" />
    <meta name="twitter:description" content="Read it on the Nimbial Blog" />
    <meta name="twitter:image" content="https://blog.nimbial.com/assets/link-preview.png" />
  </head>
  <body class="scrollable">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
